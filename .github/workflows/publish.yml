name: Publish to npm

on:
  push:
    tags:
      - 'v*'
    branches:
      - nightly

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The job needs `contents: write` for `gh release create`, and that is a
          # job-level grant. Without this line actions/checkout would persist the
          # write-scoped token in .git/config, where npm ci, the build, the test
          # suite, and any dependency postinstall could reach it and push to
          # master or rewrite tags. Nothing after checkout needs git auth: the
          # master check reads refs that fetch-depth: 0 already brought down, and
          # the release step gets its token through GH_TOKEN on that step alone.
          persist-credentials: false

      # For stable and rc releases: verify tag is on master
      - name: Verify tag is on master
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_SHA=$(git rev-parse HEAD)
          if ! git branch -r --contains "$TAG_SHA" | grep -q 'origin/master'; then
            echo "::error::Tag must point to a commit on master. Aborting."
            exit 1
          fi

      # Decide which npm dist-tag a tag publishes to, and refuse anything else.
      #   v1.2.3       -> latest
      #   v1.2.3-rc.1  -> rc
      #   any other version shape has no lane and fails here.
      - name: Classify release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v${PKG_VERSION}" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG_VERSION. Aborting."
            exit 1
          fi
          # Only X.Y.Z and X.Y.Z-rc.N are publishable. This is the shape gate, so
          # it rejects malformed stable versions and near-miss rc shapes
          # (-rc.x, -rc.1.2, -beta-rc.1, bare -rc) before they reach npm.
          if ! printf '%s' "$PKG_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$'; then
            echo "::error::Version $PKG_VERSION has no publish lane; only X.Y.Z and X.Y.Z-rc.N are publishable. Aborting."
            exit 1
          fi
          case "$PKG_VERSION" in
            *-rc.*)
              CHANNEL=rc
              ;;
            *)
              CHANNEL=latest
              ;;
          esac
          echo "Tag $TAG publishes to npm dist-tag: $CHANNEL"
          echo "RELEASE_CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$PKG_VERSION" >> "$GITHUB_ENV"

      # Resolve the GitHub Release body before anything is published, so a bump
      # without a changelog drain aborts the run instead of publishing a package
      # and then cutting a release with no notes. An rc falls back to its base
      # version's section, because rc and stable share one `## [X.Y.Z]` section.
      - name: Resolve release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          NOTES="${RUNNER_TEMP}/release-notes.md"
          extract_section() {
            awk -v want="## [$1]" '
              index($0, want) == 1 { capture = 1; next }
              capture && index($0, "## [") == 1 { exit }
              capture && /^\[[^]]+\]: / { exit }
              capture { print }
            ' CHANGELOG.md
          }
          extract_section "$RELEASE_VERSION" > "$NOTES"
          if [ ! -s "$NOTES" ] && [ "$RELEASE_CHANNEL" = "rc" ]; then
            extract_section "${RELEASE_VERSION%%-*}" > "$NOTES"
          fi
          if [ ! -s "$NOTES" ]; then
            echo "::error::No CHANGELOG.md section for $RELEASE_VERSION. Drain [Unreleased] into a '## [${RELEASE_VERSION%%-*}]' section before tagging. Aborting."
            exit 1
          fi
          echo "Release body resolved from CHANGELOG.md ($(wc -l < "$NOTES") lines)."
          echo "RELEASE_NOTES=$NOTES" >> "$GITHUB_ENV"

      # For nightly: stamp a prerelease version
      - name: Set nightly version
        if: github.ref == 'refs/heads/nightly'
        run: |
          BASE=$(node -p "require('./package.json').version")
          STAMP=$(date -u +%Y%m%d)
          NIGHTLY="${BASE}-nightly.${STAMP}.${GITHUB_RUN_NUMBER}"
          npm version "$NIGHTLY" --no-git-tag-version
          echo "Publishing nightly version: $NIGHTLY"

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - run: npm run build

      - run: npm test

      # Stable: publish as @latest (default dist-tag).
      # Guard: a prerelease must never reach @latest, so re-check both the tag and the
      # package version here instead of trusting the classify step alone.
      - name: Publish stable
        if: env.RELEASE_CHANNEL == 'latest'
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          case "$TAG" in
            *-*)
              echo "::error::Refusing to publish prerelease tag $TAG as @latest. Aborting."
              exit 1
              ;;
          esac
          case "$PKG_VERSION" in
            *-*)
              echo "::error::Refusing to publish prerelease version $PKG_VERSION as @latest. Aborting."
              exit 1
              ;;
          esac
          npm publish --provenance --access public

      # Release candidate: publish as @rc, never @latest
      - name: Publish release candidate
        if: env.RELEASE_CHANNEL == 'rc'
        run: npm publish --provenance --access public --tag rc

      # Nightly: publish as @nightly
      - name: Publish nightly
        if: github.ref == 'refs/heads/nightly'
        run: npm publish --provenance --access public --tag nightly

      # Cut a GitHub Release for stable and rc tags, using the body resolved from
      # CHANGELOG.md before the publish steps ran.
      - name: Create GitHub Release
        if: env.RELEASE_CHANNEL == 'latest' || env.RELEASE_CHANNEL == 'rc'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$RELEASE_CHANNEL" = "rc" ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$RELEASE_NOTES" \
              --prerelease
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$RELEASE_NOTES"
          fi
