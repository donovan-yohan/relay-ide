name: relay-ide
description: Custom belayer framework for relay-ide. GitHub Issues intake, Nous Tool Gateway with kimi-k2.6 for all agents (implementation + review + ship), gstack autoplan for upstream spec generation.
version: 0.2.0
requires:
  - belayer (daemon + CLI)
  - gh (GitHub CLI, for issue intake and PR creation)
  - jq (for JSON parsing in scripts)
  - node >= 24.0.0
  - npm (for build and test)
  - gstack (for /autoplan spec generation, run by orchestrator before belayer)
